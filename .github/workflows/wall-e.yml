name: wall-e

# WALL-E — the autonomous 24/7 watcher. Runs on GitHub's infrastructure (survives
# any chat session ending) and keeps the faceless-reels generator healthy:
#   * re-runs failed generator jobs (reflex, needs no keys)
#   * with WALLE_* set, MiniMax M3 diagnoses each failure and decides self-heal vs escalate
#   * with WALLACE_* set, a heavier model writes a deep diagnosis on escalation
#   * posts heartbeats + escalations to one pinned GitHub issue
# It never edits code or posts content — publish/spend/merge stay with a human.

on:
  schedule:
    - cron: "30 */4 * * *"   # every 4 hours
  workflow_dispatch:

permissions:
  actions: write             # re-run / dispatch the generator
  issues: write              # post status to the pinned issue
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install watcher deps
        run: pip install -r ops/requirements.txt

      - name: Run WALL-E
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENERATOR_WORKFLOW: faceless-reels.yml
          WATCH_BRANCH: ${{ github.ref_name }}
          # WALL-E brain (MiniMax M3) — secret for the key, vars for endpoint/model.
          WALLE_API_KEY: ${{ secrets.WALLE_API_KEY }}
          WALLE_BASE_URL: ${{ vars.WALLE_BASE_URL }}
          WALLE_MODEL: ${{ vars.WALLE_MODEL }}
          # Wallace (heavier escalation brain) — optional.
          WALLACE_API_KEY: ${{ secrets.WALLACE_API_KEY }}
          WALLACE_BASE_URL: ${{ vars.WALLACE_BASE_URL }}
          WALLACE_MODEL: ${{ vars.WALLACE_MODEL }}
        run: python ops/wall_e.py
