name: wall-e

# WALL-E — the autonomous 24/7 watcher. Runs on GitHub's infrastructure (survives
# any chat session ending) and keeps the faceless-reels generator healthy:
#   * if the last generator run FAILED  -> re-runs its failed jobs
#   * if the generator hasn't run in >25h (cadence stalled) -> kicks a fresh run
#   * otherwise -> writes a heartbeat to the run summary
# It needs no secrets — it uses the built-in GITHUB_TOKEN.

on:
  schedule:
    - cron: "30 */4 * * *"   # every 4 hours
  workflow_dispatch:

permissions:
  actions: write             # to re-run / dispatch the generator
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Watch the faceless-reels generator
        uses: actions/github-script@v7
        with:
          script: |
            const workflow_id = 'faceless-reels.yml';
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, per_page: 10,
            });
            const runs = data.workflow_runs.filter(
              r => r.event === 'schedule' || r.event === 'workflow_dispatch'
            );
            const latest = runs[0];
            let note;

            if (!latest) {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id, ref: branch });
              note = 'No prior generator runs found — dispatched one.';
            } else {
              const ageH = (Date.now() - new Date(latest.created_at).getTime()) / 3.6e6;
              if (latest.status === 'completed' && latest.conclusion === 'failure') {
                await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: latest.id });
                note = `Run #${latest.run_number} FAILED — re-running its failed jobs.`;
              } else if (latest.status === 'completed' && ageH > 25) {
                await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id, ref: branch });
                note = `No generator run in ${ageH.toFixed(0)}h — dispatched one to hold cadence.`;
              } else {
                const state = latest.conclusion || latest.status;
                note = `Healthy: run #${latest.run_number} = ${state}, ${ageH.toFixed(1)}h ago.`;
              }
            }
            core.summary.addHeading('WALL-E watcher').addRaw(note).write();
            core.info(note);
